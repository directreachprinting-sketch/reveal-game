name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is missing"; exit 1
          fi
          response=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP $response"
          cat /tmp/body
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            exit 1
          fi
