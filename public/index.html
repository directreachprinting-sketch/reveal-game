<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0014" />
<title>Reveal</title>
<style>
  :root {
    --bg-1: #0a0014;
    --bg-2: #1a0530;
    --bg-3: #2d0a4a;
    --accent: #c084fc;
    --accent-glow: rgba(192, 132, 252, 0.5);
    --accent-2: #f472b6;
    --text: #f5f0ff;
    --text-dim: #b8a8d4;
    --card: rgba(255, 255, 255, 0.05);
    --card-border: rgba(192, 132, 252, 0.2);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at top, var(--bg-3) 0%, transparent 60%),
      radial-gradient(ellipse at bottom, var(--bg-2) 0%, transparent 60%),
      var(--bg-1);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .brand {
    text-align: center;
    margin-top: 12px;
  }
  .brand h1 {
    font-size: 36px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand p {
    margin: 6px 0 0;
    color: var(--text-dim);
    font-size: 14px;
  }
  .screen {
    display: none;
    flex-direction: column;
    gap: 20px;
    animation: fade 0.3s ease;
  }
  .screen.active { display: flex; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(10px);
  }
  button.primary, button.secondary {
    width: 100%;
    padding: 18px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    font-family: inherit;
    color: white;
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 24px var(--accent-glow);
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled {
    opacity: 0.4;
    box-shadow: none;
    cursor: not-allowed;
  }
  button.secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--card-border);
  }
  button.secondary:active { transform: scale(0.98); }
  input[type="text"], textarea {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(0,0,0,0.3);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    outline: none;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  textarea {
    min-height: 140px;
    resize: vertical;
  }
  label.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    color: var(--text-dim);
  }
  /* Home */
  .home-actions { display: flex; flex-direction: column; gap: 12px; }
  .divider {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin: 4px 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 35%;
    height: 1px;
    background: var(--card-border);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  .join-row { display: flex; gap: 8px; }
  .join-row input {
    flex: 1;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 700;
    text-align: center;
  }
  .join-row button { width: auto; padding: 16px 20px; }
  /* Waiting */
  .room-code {
    font-size: 64px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 8px 0;
  }
  .waiting-status {
    text-align: center;
    color: var(--text-dim);
    font-size: 15px;
  }
  .waiting-status .dot {
    display: inline-block;
    animation: blink 1.4s infinite;
  }
  .waiting-status .dot:nth-child(2) { animation-delay: 0.2s; }
  .waiting-status .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  /* Game */
  .level-section { text-align: center; }
  .level-display {
    font-size: 56px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .level-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .level-tone {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
    min-height: 18px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #6366f1, var(--accent), var(--accent-2), #ef4444);
    border-radius: 4px;
    outline: none;
    margin: 16px 0 8px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    box-shadow: 0 0 16px var(--accent-glow);
    border: 3px solid var(--accent);
  }
  input[type="range"]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    border: 3px solid var(--accent);
  }
  .question-text {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
    margin: 8px 0 16px;
  }
  .reveal-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .reveal-card {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
  }
  .reveal-card.you { border-color: var(--accent); }
  .reveal-name {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .reveal-answer {
    font-size: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .room-tag {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 2px;
  }
  .partner-tag {
    text-align: center;
    color: var(--accent);
    font-size: 14px;
    margin-top: 4px;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .partner-tag .label {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-right: 6px;
  }
  .partner-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    margin-left: 6px;
    vertical-align: middle;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
  }
  .partner-dot.away {
    background: #f59e0b;
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    animation: blink 1.4s infinite;
  }
  .error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
  }
  .hidden { display: none !important; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .reconnect-banner {
    background: rgba(251, 191, 36, 0.15);
    border: 1px solid rgba(251, 191, 36, 0.4);
    color: #fcd34d;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 4px;
  }
  .round-meta {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .round-meta .round-num {
    color: var(--accent);
    font-weight: 700;
  }
  .round-meta .heat {
    color: #f472b6;
    font-weight: 700;
  }
  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, rgba(251, 146, 60, 0.2), rgba(244, 114, 182, 0.2));
    border: 1px solid rgba(251, 146, 60, 0.5);
    color: #fdba74;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    margin: 8px auto 4px;
  }
  .sync-badge .streak {
    background: rgba(251, 146, 60, 0.4);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
  }
  .reaction-section {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--card-border);
  }
  .reaction-label {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }
  .reaction-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .reaction-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    padding: 0;
  }
  .reaction-btn:active { transform: scale(0.9); }
  .reaction-btn.mine {
    border-color: var(--accent);
    background: rgba(192, 132, 252, 0.2);
    box-shadow: 0 0 16px rgba(192, 132, 252, 0.4);
    transform: scale(1.1);
  }
  .partner-reaction {
    text-align: center;
    margin-top: 12px;
    color: var(--text-dim);
    font-size: 13px;
    min-height: 20px;
  }
  .partner-reaction .reaction-emoji {
    font-size: 22px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .level-buttons {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .level-buttons .primary { flex: 2; }
  .level-buttons .secondary { flex: 1; }
  .unlock-section {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }
  .unlock-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .unlock-btn:active { transform: scale(0.98); }
  .unlock-btn.partner-ready {
    border-color: var(--accent);
    color: var(--accent);
    animation: pulseGlow 1.8s ease-in-out infinite;
  }
  .unlock-btn.you-ready {
    background: rgba(192, 132, 252, 0.18);
    border-color: var(--accent);
    color: var(--accent);
  }
  .unlock-btn.both-ready {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    cursor: default;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .unlock-btn:disabled { cursor: not-allowed; }
  .unlock-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(192, 132, 252, 0.3); }
    50% { box-shadow: 0 0 24px rgba(192, 132, 252, 0.7); }
  }
  .level-tone.locked { color: rgba(245, 158, 11, 0.85); }
</style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <h1>Reveal</h1>
      <p>Two answers. One moment.</p>
    </div>

    <!-- HOME -->
    <div class="screen active" id="screen-home">
      <div class="card">
        <label class="field">
          Your name (optional)
          <input type="text" id="name-input" placeholder="You" maxlength="20" />
        </label>
      </div>
      <div class="card home-actions">
        <button class="primary" id="btn-create">Create a Room</button>
        <div class="divider">or</div>
        <div class="join-row">
          <input type="text" id="join-code" placeholder="CODE" maxlength="4" autocomplete="off" />
          <button class="secondary" id="btn-join">Join</button>
        </div>
        <div class="error hidden" id="home-error"></div>
      </div>
    </div>

    <!-- WAITING -->
    <div class="screen" id="screen-waiting">
      <div class="card">
        <div class="level-label" style="text-align:center;">Room Code</div>
        <div class="room-code" id="room-code-display">----</div>
        <div class="waiting-status">
          waiting for player two<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
      </div>
      <div class="card">
        <button class="secondary" id="btn-copy-link">Copy invite link</button>
      </div>
    </div>

    <!-- GAME -->
    <div class="screen" id="screen-game">
      <div class="room-tag" id="room-tag-game"></div>
      <div class="partner-tag hidden" id="partner-tag">
        <span class="label">Playing with</span>
        <span id="partner-name">—</span>
        <span class="partner-dot" id="partner-dot"></span>
      </div>
      <div class="reconnect-banner hidden" id="reconnect-banner">Partner reconnecting...</div>

      <div class="round-meta hidden" id="round-meta">
        <span>Round <span class="round-num" id="round-num">1</span></span>
        <span>Heat <span class="heat" id="heat-level">L1</span></span>
      </div>

      <div class="card level-section" id="level-picker">
        <div class="level-label">Level</div>
        <div class="level-display" id="level-display">5</div>
        <input type="range" id="level-slider" min="1" max="10" value="5" />
        <div class="level-tone" id="level-tone"></div>
        <div class="level-buttons">
          <button class="primary" id="btn-get-question">Get a Question</button>
          <button class="secondary" id="btn-surprise">Surprise me</button>
        </div>
        <div class="unlock-section">
          <button class="unlock-btn" id="btn-unlock" type="button">Unlock higher levels</button>
          <div class="unlock-hint" id="unlock-hint">Both must tap to open levels 8 to 10</div>
        </div>
      </div>

      <div class="card hidden" id="question-card">
        <div class="level-label" style="text-align:center;">Level <span id="q-level">1</span></div>
        <div class="question-text" id="question-text"></div>
        <label class="field">
          Your answer
          <textarea id="answer-input" placeholder="Type your answer..." maxlength="2000"></textarea>
        </label>
        <button class="primary" id="btn-submit" style="margin-top:14px;">Submit</button>
        <div class="waiting-status hidden" id="submit-waiting" style="margin-top:14px;">
          waiting for the other answer<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
      </div>

      <div class="card hidden" id="reveal-card">
        <div class="level-label" style="text-align:center;">The Reveal</div>
        <div class="sync-badge hidden" id="sync-badge">
          <span id="sync-text">Synced</span>
          <span class="streak hidden" id="sync-streak">1 in a row</span>
        </div>
        <div class="question-text" id="reveal-question"></div>
        <div class="reveal-grid" id="reveal-grid"></div>
        <button class="primary" id="btn-next" style="margin-top:18px;">Next Question</button>
      </div>
    </div>

    <!-- DISCONNECT -->
    <div class="screen" id="screen-disconnect">
      <div class="card">
        <div class="question-text">The other player left.</div>
        <button class="primary" id="btn-home">Back to Home</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({
      reconnection: true,
      reconnectionDelay: 500,
      reconnectionDelayMax: 3000,
      reconnectionAttempts: Infinity,
    });

    const TONES = {
      1: 'Surface, getting to know you',
      2: 'Light personal',
      3: 'Personality and values',
      4: 'A little flirty',
      5: 'Personal stories',
      6: 'Romantic and emotional',
      7: 'Flirty and suggestive',
      8: 'Spicy',
      9: 'Explicit',
      10: 'No-holds-barred',
    };

    const screens = {
      home: document.getElementById('screen-home'),
      waiting: document.getElementById('screen-waiting'),
      game: document.getElementById('screen-game'),
      disconnect: document.getElementById('screen-disconnect'),
    };
    function show(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    // Stable per-device player ID — survives reloads, used to reconnect into the same room
    function getPlayerId() {
      let id = null;
      try { id = localStorage.getItem('reveal_player_id'); } catch (e) {}
      if (!id) {
        id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        try { localStorage.setItem('reveal_player_id', id); } catch (e) {}
      }
      return id;
    }

    // Session uses localStorage with a 24h freshness window so the user can fully close
    // the browser and rejoin the same room when they come back later.
    const SESSION_TTL_MS = 24 * 60 * 60 * 1000;
    function saveSession(code, name) {
      try {
        localStorage.setItem('reveal_session', JSON.stringify({
          code, name: name || null, ts: Date.now(),
        }));
      } catch (e) {}
    }
    function clearSession() {
      try { localStorage.removeItem('reveal_session'); } catch (e) {}
    }
    function getSession() {
      try {
        const raw = localStorage.getItem('reveal_session');
        if (!raw) return { room: null, name: null };
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.code) return { room: null, name: null };
        if (Date.now() - (parsed.ts || 0) > SESSION_TTL_MS) {
          localStorage.removeItem('reveal_session');
          return { room: null, name: null };
        }
        return { room: parsed.code, name: parsed.name };
      } catch (e) { return { room: null, name: null }; }
    }

    let state = {
      code: null,
      playerId: getPlayerId(),
      name: null,
      players: [],
      currentQuestion: null,
      submitted: false,
      onGameScreen: false,
      myReaction: null,
      highestLevel: 0,
      readyToUnlock: [],
      deepEndUnlocked: false,
      deepEndFloor: 8,
    };

    function setReconnectBanner(visible, text) {
      const el = document.getElementById('reconnect-banner');
      if (text) el.textContent = text;
      el.classList.toggle('hidden', !visible);
    }

    socket.on('connect', () => {
      // If URL has ?room=CODE, prefill join field. If it differs from a saved session,
      // the URL wins — clear the session so we don't auto-pull them into a stale room.
      const params = new URLSearchParams(location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        const upper = roomParam.toUpperCase();
        const input = document.getElementById('join-code');
        if (!input.value) input.value = upper;
        const existing = getSession();
        if (existing.room && existing.room !== upper) {
          clearSession();
        }
      }

      // Auto-rejoin: if we have a saved session, try to rejoin.
      // Screen choice (waiting vs game) is driven by the room_state event that follows.
      const saved = getSession();
      if (saved.room && state.code !== saved.room) {
        const name = saved.name || getName() || 'Player';
        socket.emit('join_room', { code: saved.room, name, playerId: state.playerId }, (res) => {
          if (res && res.ok) {
            state.code = res.code;
            state.name = name;
            saveSession(res.code, name);
            document.getElementById('room-tag-game').textContent = 'ROOM ' + res.code;
            document.getElementById('room-code-display').textContent = res.code;
          } else {
            // Room is gone or full — clean up and stay on home
            clearSession();
          }
        });
      }
    });

    socket.on('disconnect', () => {
      // We lost the server. If we were in a game, show a reconnecting hint.
      if (state.onGameScreen) {
        setReconnectBanner(true, 'Reconnecting...');
      }
    });

    // When the tab becomes visible again (phone unlock, app switch back),
    // force-resync if the socket has gone quiet.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (!socket.connected) {
        // Socket.IO will retry on its own, but kick it now to speed things up
        try { socket.connect(); } catch (e) {}
        return;
      }
      // Socket says it's connected — but it might be a zombie. Re-emit join_room
      // with our saved session to confirm the server still knows about us and to
      // pull current question/state.
      const saved = getSession();
      if (saved.room) {
        const name = saved.name || 'Player';
        socket.emit('join_room', { code: saved.room, name, playerId: state.playerId }, (res) => {
          if (res && res.ok) {
            state.code = res.code;
            state.name = name;
          } else {
            // Room is gone — back to home, clear stale session
            clearSession();
            state.code = null;
            state.onGameScreen = false;
            show('home');
          }
        });
      }
    });

    function showError(msg) {
      const el = document.getElementById('home-error');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function getName() {
      const v = document.getElementById('name-input').value.trim();
      return v || null;
    }

    document.getElementById('btn-create').addEventListener('click', () => {
      const name = getName() || 'Player 1';
      socket.emit('create_room', { name, playerId: state.playerId }, (res) => {
        if (!res.ok) return showError(res.error || 'Failed to create room');
        state.code = res.code;
        state.name = name;
        saveSession(res.code, name);
        document.getElementById('room-code-display').textContent = res.code;
        show('waiting');
      });
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      const code = document.getElementById('join-code').value.trim().toUpperCase();
      if (code.length !== 4) return showError('Enter a 4-letter code');
      const name = getName() || 'Player 2';
      socket.emit('join_room', { code, name, playerId: state.playerId }, (res) => {
        if (!res.ok) return showError(res.error || 'Failed to join');
        state.code = res.code;
        state.name = name;
        saveSession(res.code, name);
        document.getElementById('room-tag-game').textContent = 'ROOM ' + res.code;
        state.onGameScreen = true;
        show('game');
      });
    });

    document.getElementById('btn-copy-link').addEventListener('click', async () => {
      const url = location.origin + '/?room=' + state.code;
      try {
        await navigator.clipboard.writeText(url);
        const btn = document.getElementById('btn-copy-link');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
      } catch (e) {
        prompt('Copy this link:', url);
      }
    });

    function updatePartnerTag() {
      const tag = document.getElementById('partner-tag');
      const nameEl = document.getElementById('partner-name');
      const dot = document.getElementById('partner-dot');
      const partner = (state.players || []).find(p => p.id !== state.playerId);
      // Refresh unlock UI too — partner's name might be needed in the label
      updateUnlockUI();
      if (partner && partner.name) {
        nameEl.textContent = partner.name;
        dot.classList.toggle('away', partner.connected === false);
        tag.classList.remove('hidden');
      } else {
        tag.classList.add('hidden');
      }
    }

    socket.on('room_state', (data) => {
      state.players = data.players;
      // Hide reconnect banner if all players are connected
      const allConnected = data.players.every(p => p.connected !== false);
      if (allConnected) setReconnectBanner(false);
      updatePartnerTag();

      if (!state.code) return; // not in a room yet (still on home screen)

      // Screen choice is driven by player count.
      // Don't override the disconnect screen — that's a terminal state until user clicks home.
      if (screens.disconnect.classList.contains('active')) return;

      if (data.players.length >= 2) {
        document.getElementById('room-tag-game').textContent = 'ROOM ' + state.code;
        state.onGameScreen = true;
        show('game');
      } else if (data.players.length === 1) {
        // Alone in the room — show waiting screen with the code
        document.getElementById('room-code-display').textContent = state.code;
        state.onGameScreen = false;
        show('waiting');
      }
    });

    socket.on('player_disconnecting', (data) => {
      // Soft state — partner may come back within the grace period.
      const partner = (data && data.name) ? data.name : 'Partner';
      setReconnectBanner(true, partner + ' lost connection — waiting...');
    });

    socket.on('player_reconnected', (data) => {
      setReconnectBanner(false);
    });

    // Level slider
    const slider = document.getElementById('level-slider');
    const levelDisplay = document.getElementById('level-display');
    const levelTone = document.getElementById('level-tone');
    function updateLevelUI() {
      levelDisplay.textContent = slider.value;
      const lvl = Number(slider.value);
      const locked = lvl >= state.deepEndFloor && !state.deepEndUnlocked;
      if (locked) {
        levelTone.textContent = 'Locked. Unlock higher levels first.';
        levelTone.classList.add('locked');
      } else {
        levelTone.textContent = TONES[slider.value] || '';
        levelTone.classList.remove('locked');
      }
      // Disable Get a Question if at locked level
      document.getElementById('btn-get-question').disabled = locked;
    }
    slider.addEventListener('input', updateLevelUI);
    updateLevelUI();

    document.getElementById('btn-get-question').addEventListener('click', () => {
      const level = Number(slider.value);
      socket.emit('pick_level', { level });
    });
    document.getElementById('btn-surprise').addEventListener('click', () => {
      socket.emit('pick_level', { random: true });
    });

    function updateRoundMeta(roundNumber, highestLevel) {
      const meta = document.getElementById('round-meta');
      if (!roundNumber) {
        meta.classList.add('hidden');
        return;
      }
      document.getElementById('round-num').textContent = roundNumber;
      document.getElementById('heat-level').textContent = 'L' + (highestLevel || 1);
      meta.classList.remove('hidden');
    }

    function updateUnlockUI() {
      const btn = document.getElementById('btn-unlock');
      const hint = document.getElementById('unlock-hint');
      if (state.deepEndUnlocked) {
        btn.textContent = 'Higher levels unlocked';
        btn.className = 'unlock-btn both-ready';
        btn.disabled = true;
        hint.textContent = "You're both in";
        return;
      }
      const youReady = state.readyToUnlock.includes(state.playerId);
      const partner = (state.players || []).find(p => p.id !== state.playerId);
      const partnerReady = partner && state.readyToUnlock.includes(partner.id);
      btn.disabled = false;
      btn.classList.remove('partner-ready', 'you-ready', 'both-ready');
      if (youReady && !partnerReady) {
        btn.textContent = "You're ready, waiting for " + (partner && partner.name ? partner.name : 'partner');
        btn.classList.add('you-ready');
        hint.textContent = 'Tap again to un-ready';
      } else if (!youReady && partnerReady) {
        btn.textContent = (partner && partner.name ? partner.name : 'Partner') + ' is ready, tap to match';
        btn.classList.add('partner-ready');
        hint.textContent = 'Both must tap to open levels 8 to 10';
      } else {
        btn.textContent = 'Unlock higher levels';
        hint.textContent = 'Both must tap to open levels 8 to 10';
      }
    }

    document.getElementById('btn-unlock').addEventListener('click', () => {
      if (state.deepEndUnlocked) return;
      socket.emit('toggle_unlock');
    });

    socket.on('unlock_state', (data) => {
      state.readyToUnlock = (data && data.ready) || [];
      state.deepEndUnlocked = !!(data && data.unlocked);
      if (data && data.floor) state.deepEndFloor = data.floor;
      updateUnlockUI();
      updateLevelUI();
    });

    socket.on('question', (data) => {
      const isSameQuestion = state.currentQuestion === data.question;
      state.currentQuestion = data.question;
      document.getElementById('q-level').textContent = data.level;
      document.getElementById('question-text').textContent = data.question;
      updateRoundMeta(data.roundNumber, data.highestLevel);
      if (!isSameQuestion) {
        // Brand new question: reset answer state and switch to question card
        state.submitted = false;
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').disabled = false;
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('btn-submit').textContent = 'Submit';
        document.getElementById('submit-waiting').classList.add('hidden');
        document.getElementById('question-card').classList.remove('hidden');
        document.getElementById('reveal-card').classList.add('hidden');
        document.getElementById('level-picker').classList.add('hidden');
      } else {
        if (!screens.game.classList.contains('active')) show('game');
      }
    });

    document.getElementById('btn-submit').addEventListener('click', () => {
      if (state.submitted) return;
      const text = document.getElementById('answer-input').value.trim();
      if (!text) return;
      state.submitted = true;
      socket.emit('submit_answer', { text });
      document.getElementById('answer-input').disabled = true;
      document.getElementById('btn-submit').disabled = true;
      document.getElementById('btn-submit').textContent = 'Submitted';
      document.getElementById('submit-waiting').classList.remove('hidden');
    });

    socket.on('answer_status', (data) => {
      // If we previously submitted and a refresh/reconnect happened, restore the waiting state
      if (data && Array.isArray(data.submitted) && data.submitted.includes(state.playerId)) {
        state.submitted = true;
        document.getElementById('answer-input').disabled = true;
        document.getElementById('btn-submit').disabled = true;
        document.getElementById('btn-submit').textContent = 'Submitted';
        document.getElementById('submit-waiting').classList.remove('hidden');
      }
    });

    socket.on('reveal', (data) => {
      const grid = document.getElementById('reveal-grid');
      grid.innerHTML = '';
      data.answers.forEach(a => {
        const isMe = a.id === state.playerId;
        const card = document.createElement('div');
        card.className = 'reveal-card' + (isMe ? ' you' : '');
        const name = document.createElement('div');
        name.className = 'reveal-name';
        name.textContent = isMe ? 'You' : (a.name || 'Them');
        const answer = document.createElement('div');
        answer.className = 'reveal-answer';
        answer.textContent = a.answer || '(no answer)';
        card.appendChild(name);
        card.appendChild(answer);
        grid.appendChild(card);
      });
      document.getElementById('reveal-question').textContent = data.question;

      // Sync indicator
      const syncBadge = document.getElementById('sync-badge');
      const syncText = document.getElementById('sync-text');
      const syncStreakEl = document.getElementById('sync-streak');
      if (data.synced) {
        const sec = Math.max(1, Math.round((data.syncDeltaMs || 0) / 1000));
        syncText.textContent = sec <= 1 ? 'Synced under a second apart' : 'Synced ' + sec + ' seconds apart';
        if (data.syncStreak && data.syncStreak >= 2) {
          syncStreakEl.textContent = data.syncStreak + ' in a row';
          syncStreakEl.classList.remove('hidden');
        } else {
          syncStreakEl.classList.add('hidden');
        }
        syncBadge.classList.remove('hidden');
      } else {
        syncBadge.classList.add('hidden');
      }

      updateRoundMeta(data.roundNumber, state.highestLevel || data.level);
      document.getElementById('question-card').classList.add('hidden');
      document.getElementById('reveal-card').classList.remove('hidden');
    });

    // Reactions feature removed

    document.getElementById('btn-next').addEventListener('click', () => {
      socket.emit('next_question');
    });

    socket.on('next_round', () => {
      document.getElementById('reveal-card').classList.add('hidden');
      document.getElementById('question-card').classList.add('hidden');
      document.getElementById('level-picker').classList.remove('hidden');
    });

    socket.on('player_left', () => {
      // Only fires after the 60-second grace period — the partner is really gone.
      state.onGameScreen = false;
      clearSession();
      show('disconnect');
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      // Explicit leave — tell the server, clear session, go home
      try { socket.emit('leave_room'); } catch (e) {}
      clearSession();
      state.code = null;
      state.onGameScreen = false;
      location.href = '/';
    });

    // Auto-uppercase the join code
    document.getElementById('join-code').addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
    });
  </script>
</body>
</html>
